name: Gerar APK do MARGEPLAY

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Apontar a atualização automática para o providers.json deste repositório
        run: |
          URL="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/providers.json"
          echo "// Gerado pelo GitHub Actions" > app/src/main/assets/www/config.js
          echo "window.MP_CONFIG_URL='${URL}';" >> app/src/main/assets/www/config.js
          echo "Lista de provedores: ${URL}"
      - name: Compilar APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v5
        with:
          name: MARGEPLAY-apk
          path: app/build/outputs/apk/release/*.apk
