plugins {
    id 'com.android.application'
}

android {
    namespace 'com.margeplay.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.margeplay.app"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Para publicar, configure sua própria assinatura (Build > Generate Signed APK no Android Studio).
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
